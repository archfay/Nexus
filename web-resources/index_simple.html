<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Userbot - Web Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        p {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .link-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .link-card:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .link-card .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .link-card .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .link-card .desc {
            font-size: 14px;
            opacity: 0.8;
        }
        .status {
            margin-top: 40px;
            padding: 15px;
            background: rgba(0, 255, 0, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Nexus Userbot</h1>
        <p>Добро пожаловать в веб-панель управления</p>
        
        <div class="links">
            <a href="/pages/docs.html" class="link-card">
                <div class="icon">📖</div>
                <div class="title">Документация</div>
                <div class="desc">Руководство и примеры</div>
            </a>
            
            <a href="/pages/modules.html" class="link-card">
                <div class="icon">📦</div>
                <div class="title">Модули</div>
                <div class="desc">Список модулей</div>
            </a>
            
            <a href="/pages/dashboard.html" class="link-card">
                <div class="icon">🎛️</div>
                <div class="title">Панель</div>
                <div class="desc">Управление ботом</div>
            </a>
            
            <a href="/api/dashboard/stats" class="link-card">
                <div class="icon">📊</div>
                <div class="title">API</div>
                <div class="desc">Статистика (JSON)</div>
            </a>
        </div>
        
        <div class="status">
            ✅ Веб-сервер работает
        </div>
    </div>
</body>
</html>
